name: Build

# Сборка под все платформы Tauri. iOS и macOS можно собрать только на
# macOS-раннере (нужен Xcode — его нет под Windows/Linux в принципе), Linux —
# на Linux-раннере (нужны нативные библиотеки webkit2gtk). Windows и Android
# можно собрать и локально на машине с Android SDK/NDK и включённым
# Developer Mode, но CI даёт воспроизводимую сборку под все платформы сразу.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.1.12297006"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Установить системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установить фронтенд-зависимости
        run: bun install --frozen-lockfile

      - name: Собрать приложение
        run: bun run tauri build ${{ matrix.args }}

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: passman-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android NDK
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установить фронтенд-зависимости
        run: bun install --frozen-lockfile

      - name: Инициализировать Android-проект
        run: bun run tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}

      - name: Собрать APK/AAB
        run: bun run tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          # Для подписанного релизного билда (публикация в Play Store) нужно
          # добавить секреты репозитория с keystore и прокинуть их сюда —
          # см. https://v2.tauri.app/distribute/sign/android/. Без них
          # получится неподписанный релизный APK/AAB — для тестов достаточно.

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: passman-android
          path: src-tauri/gen/android/app/build/outputs/**
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    # Сборка .ipa для реального устройства/App Store требует Apple Developer
    # аккаунта: сертификат подписи, provisioning profile и Team ID,
    # прокинутые через секреты репозитория (см.
    # https://v2.tauri.app/distribute/sign/ios/). Без них Xcode не сможет
    # подписать архив — шаг ниже помечен continue-on-error, чтобы это не
    # валило остальные платформы в матрице, пока подпись не настроена.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установить фронтенд-зависимости
        run: bun install --frozen-lockfile

      - name: Инициализировать iOS-проект
        run: bun run tauri ios init

      - name: Собрать iOS-приложение
        run: bun run tauri ios build

      - name: Загрузить артефакты
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: passman-ios
          path: src-tauri/gen/apple/build/**
          if-no-files-found: ignore
